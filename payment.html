<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // 在 body 渲染前读取语言偏好,若非英文则隐藏待翻译文本,避免中英闪动
    (function () {
      try {
        var lang = localStorage.getItem('lang') || 'en';
        if (lang !== 'en') {
          document.documentElement.lang = 'zh-CN';
          document.documentElement.classList.add('i18n-loading');
        }
      } catch (e) {}
    })();
  </script>
  <title>Thank You — guokaigdg</title>
  <meta name="description" content="Thank you for your support. Every contribution becomes food and treats for the cats." />
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><img src="assets/favicon.ico" alt="guokaigdg" /></a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="payment.html" class="active" data-i18n="nav.payment">Donate</a>
        <button class="lang-toggle" type="button" aria-label="切换语言 / Switch language">中</button>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <!-- Hero -->
    <section class="pay-hero">
      <div class="hero-cats" id="hero-cats" aria-hidden="true"></div>
      <h1 data-i18n="pay.title">Thank You</h1>
      <p class="bio" data-i18n="pay.bio">Every contribution becomes food and treats for Xinba and Dabai.</p>
    </section>

    <!-- 投喂方式 -->
    <section class="block">
      <p class="eyebrow" data-i18n="pay.donate">Donate</p>
      <div class="qr-grid">
        <div class="qr qr-wechat">
          <img src="assets/wechat.jpeg" alt="WeChat QR code" width="275" height="200" />
          <div class="name" data-i18n="pay.wechat">WeChat</div>
          <div class="meta" data-i18n="pay.scan">Scan</div>
        </div>
        <div class="qr">
          <img src="assets/zhifubao.jpeg" alt="Alipay QR code" width="250" height="200" />
          <div class="name" data-i18n="pay.alipay">Alipay</div>
          <div class="meta" data-i18n="pay.scan">Scan</div>
        </div>
      </div>
    </section>

    <!-- 感谢 -->
    <section class="block">
      <p class="thanks" data-i18n="pay.thanks">Scan to treat the cats</p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">© 2026 guokaigdg. All Rights Reserved.</div>
  </footer>

  <script src="assets/i18n.js"></script>
  <script>
    // 在 hero 背景中随机排列猫咪图片，铺满整个区块（允许轻微重叠）
    // 注意：此脚本须在 i18n.js 之后执行，以便基于当前语言文字位置避让
    (function () {
      var container = document.getElementById("hero-cats");
      if (!container) return;
      var srcs = [
        "assets/dabai.avif",
        "assets/xinba.avif",
        "assets/dabai2.avif",
        "assets/xinba2.avif",
      ];
      var W = container.clientWidth || window.innerWidth;
      var H = container.clientHeight || window.innerHeight;
      var placed = [];
      var isMobile = window.innerWidth <= 560;
      var count = isMobile ? 18 : 24; // 移动端少放几只，避免拥挤
      var bigCount = isMobile ? 5 : 8; // 大猫数量，营造大小对比

      // 文字区域（标题 + 描述）作为避让区，猫咪尽量不盖住文字背景
      var textZones = (function () {
        var hero = container.parentElement;
        var els = [hero.querySelector("h1"), hero.querySelector(".bio")];
        var cRect = container.getBoundingClientRect();
        var zones = [];
        for (var i = 0; i < els.length; i++) {
          if (!els[i]) continue;
          var r = els[i].getBoundingClientRect();
          zones.push({
            x: r.left - cRect.left - 12,
            y: r.top - cRect.top - 12,
            w: r.width + 24,
            h: r.height + 24,
          });
        }
        return zones;
      })();

      // 计算新猫咪与文字区域的重叠面积占比（取较小者面积作分母）
      function overlapsText(x, y, size) {
        for (var i = 0; i < textZones.length; i++) {
          var z = textZones[i];
          var ox = Math.min(x + size, z.x + z.w) - Math.max(x, z.x);
          var oy = Math.min(y + size, z.y + z.h) - Math.max(y, z.y);
          if (ox > 0 && oy > 0) {
            var ratio = (ox * oy) / Math.min(size * size, z.w * z.h);
            if (ratio > 0.15) return true;
          }
        }
        return false;
      }

      // 计算新猫咪与已放置猫咪的重叠面积占比（取较小者面积作分母）
      function overlapRatio(x, y, size, other) {
        var ox = Math.min(x + size, other.x + other.size) - Math.max(x, other.x);
        var oy = Math.min(y + size, other.y + other.size) - Math.max(y, other.y);
        if (ox <= 0 || oy <= 0) return 0;
        return (ox * oy) / Math.min(size * size, other.size * other.size);
      }

      function tooCrowded(x, y, size) {
        for (var i = 0; i < placed.length; i++) {
          if (overlapRatio(x, y, size, placed[i]) > 0.35) return true;
        }
        return false;
      }

      for (var i = 0; i < count; i++) {
        var img = document.createElement("img");
        img.src = srcs[Math.floor(Math.random() * srcs.length)];
        img.alt = "";
        var size;
        if (i < bigCount) {
          // 大猫：桌面 90–150px，移动端 70–110px
          size = isMobile ? 70 + Math.random() * 40 : 90 + Math.random() * 60;
        } else {
          // 小猫：桌面 36–76px，移动端 24–56px
          size = isMobile ? 24 + Math.random() * 32 : 36 + Math.random() * 40;
        }

        var x = 0;
        var y = 0;
        for (var attempt = 0; attempt < 20; attempt++) {
          x = Math.random() * (W - size);
          y = Math.random() * (H - size);
          if (!tooCrowded(x, y, size) && !overlapsText(x, y, size)) break;
        }

        img.style.width = size + "px";
        img.style.left = x + "px";
        img.style.top = y + "px";
        img.style.transform =
          "rotate(" + (Math.random() * 40 - 20) + "deg)" +
          (Math.random() < 0.5 ? " scaleX(-1)" : "");
        img.style.opacity = (0.45 + Math.random() * 0.4).toFixed(2);
        container.appendChild(img);
        placed.push({ x: x, y: y, size: size });
      }
    })();
  </script>
</body>

</html>
